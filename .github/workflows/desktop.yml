name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, script: "dist:win", artifact: "apps/desktop/release/*.exe" }
          - { os: ubuntu-latest, script: "dist:linux", artifact: "apps/desktop/release/*.AppImage" }
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with: { name: "petra-${{ matrix.os }}", path: "${{ matrix.artifact }}" }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: "${{ matrix.artifact }}" }
